name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - run: pip install -r requirements.txt

      # Only the real, isolated suite (tests/unit, tests/integration).
      # tests/*.py at the root are legacy live-HTTP scripts against an
      # external preview server with a hardcoded credential — never run
      # those in CI.
      - run: pytest tests/unit tests/integration

  web-unit:
    name: Web unit/component tests (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: apps/web/yarn.lock

      - run: yarn install --frozen-lockfile
      - run: yarn test

  web-e2e:
    name: Web e2e smoke tests (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: apps/web/yarn.lock

      - run: yarn install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      # Only smoke.spec.js — practice-design-diagram.spec.js intentionally
      # talks to a REAL local backend (see its own header comment) that this
      # job never starts; it's a manual/local-only check, not part of the
      # mocked-backend smoke layer this job is named for.
      - run: yarn test:e2e e2e/smoke.spec.js

  mobile:
    name: Mobile tests (Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - run: npm ci
      - run: npm test
